<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Optimized Student List</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        table { border-collapse: collapse; width: 600px; }
        th, td { border: 1px solid #ccc; padding: 10px; text-align: left; }
        a { margin-right: 12px; }
    </style>
</head>
<body>
    <h1>Optimized Student List</h1>
    <p><a href="/">Home</a> | <a href="/students/">Original list</a></p>

    <table>
        <thead>
            <tr>
                <th>Student</th>
                <th>Program</th>
                <th>Year</th>
            </tr>
        </thead>
        <tbody>
            {% for student in students %}
            <tr>
                <td>{{ student.full_name }}</td>
                <td>{{ student.program.name }}</td>
                <td>{{ student.year_level }}</td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="3">No students available.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
